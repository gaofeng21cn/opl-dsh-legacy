# Tool-free plain chat, declared through the shared preset registry.
- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        order: 0
        plugins:
          # Plain chat mounts no tools or workspace instructions.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a helpful conversational assistant. Help with questions, writing,
                translation, and reasoning. You have no tools to read local files, run
                commands, browse the web, or delegate work. When a task needs local project
                access, ask the user to open a workspace and start a project conversation.
              complete: true
              includeRuntimeContext: false

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
